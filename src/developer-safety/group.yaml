name: Developer Safety
description: Universal control + safety layer — kill-switch, steer, commit-on-stop hooks plus commit-no-coauthor / worktrees-operator-initiated conventions. Usable in any session; enhances developer-workflows (its hooks engage across the phase loop) when both are installed.
category: Coding
requires: []
standalone: true
enhances: [development-lifecycle]
capabilities: [recoverability]
# Per-plugin marketplace version. Bump on every release that ships new/changed
# primitives so `claude plugin update developer-safety@crickets` actually pulls
# them (the marketplace entry compares this value; a static version no-ops the
# update). 0.1.1 = the first bump past the original 0.1.0 — ports the host-portable
# workspace resolution from the .sh hooks to their .ps1 twins (kill-switch, steer,
# commit-on-stop), so the operator-control hooks read the real workspace root on
# Antigravity/Windows (cwd = plugin dir, workspace on stdin) instead of doing inert
# cwd-relative .harness/ checks. Restores .sh/.ps1 parity; .sh + Claude Code behavior
# unchanged. 0.1.2 = hardens commit-on-stop.ps1 against the pwsh-7.4 native-command
# throw: with $PSNativeCommandUseErrorActionPreference defaulting $true under
# $ErrorActionPreference='Stop', a non-zero `git` exit threw instead of letting the
# hook's $LASTEXITCODE/fallback guards run, crashing the Stop event on a non-git
# dir, detached HEAD, or unborn branch. The non-fatal git probes now opt out of the
# throw (try/catch, mirroring the .sh twin's `||`/`if` guards); the snapshot-creating
# calls still throw so a real write failure aborts loudly. Restores .sh/.ps1 robustness
# parity; .sh + Claude Code behavior unchanged.
# 0.2.0 = retires the `worktrees-never-auto` snippet in favor of
# `worktrees-operator-initiated` (V5-10 sibling #2; ADR 0022). The blanket
# "never create worktrees" prohibition became wrong once `/spawn-worker` made
# operator-initiated worker worktrees a first-class coordinator workflow. The new
# snippet keeps the load-bearing guarantee (no *autonomous* worktree creation) while
# affirming that an operator-initiated worktree — `/spawn-worker`, or an explicit
# request — is expected, not an exception. Snippet file + `name:` renamed to stay
# matched; behavior for a session with no operator worktree request is unchanged.
# 0.3.1 = declare capabilities: [recoverability] (AG Phase-2 capability-declaration hygiene).
# 0.3.3 = commit-no-coauthor and worktrees-operator-initiated corrected
# supported_hosts to [antigravity] only (R2.1 / cricketsBuild#1's kind×host
# expressibility lint caught both claiming claude-code for kind: snippet,
# which emit_claude.py has always dropped ("Claude has no instruction-file
# primitive"). Claude Code users of this plugin never received this content;
# this stops the false claim, it does not add a new emission path.
# 0.3.4 = new scripts/recoverability_classifier.py — the mechanical subset of
# the recoverability doctrine (ref-delete reachability, tag-publication
# status, fast-forward-vs-history-rewrite push classification); returns
# NEEDS_JUDGMENT rather than guessing for anything git can't resolve on its
# own (PLAN-r2-enforcement-and-sync task 4).
# 0.3.5 = steer migrated PreToolUse -> UserPromptSubmit + additionalContext
# JSON (R2.2 task 5 live-verify: PreToolUse stdout injection was never
# actually true). Real behavior change: guidance now surfaces on the next
# submitted prompt, not the next tool call; no longer fires on Antigravity
# at all (no UserPromptSubmit equivalent there).
# 0.3.6 = AG Wave A rename 1: enhances: [developer-workflows] -> [development-lifecycle].
# 0.4.0 = new coauthor-guard hook (PLAN-wave-c-design-and-conventions task 7):
# a native git prepare-commit-msg hook, not a Claude-Code lifecycle hook --
# deterministically strips any Co-Authored-By trailer regardless of which
# agent's name is on it. Additive on top of the existing commit-no-coauthor
# snippet + host includeCoAuthoredBy floor, not a replacement. No automated
# installer wires it in yet (mirrors privacy's pre-push convention) -- see
# hooks/coauthor-guard/hook.md for manual install steps on both hosts.
# 0.4.1 = recoverability_classifier.py gains a `push` CLI (main()) that
# resolves local/remote SHAs from a repo + branch name and prints/exits on
# the Verdict, and skills/recoverability/SKILL.md gains a "Push
# classification mechanism" section instructing the skill to invoke it and
# read the exit code, instead of judging push recoverability by prose alone
# (CONS-2 task 8, the Consolidation arc's crickets-slim lane). Library
# functions classify_ref_delete/classify_tag_overwrite are unchanged and
# stay un-wired to a CLI; the SKILL.md doctrine table itself is unchanged,
# this only gives its push row a mechanical backing.
# 0.5.0 = new commit-msg-gate hook (Consolidation ruling 4, shipped CONS-8):
# a native git commit-msg hook (not prepare-commit-msg -- this one can reject
# the commit outright) that rejects a commit SUBJECT LINE containing an
# internal codename pattern (AA/C/FIN/R/G families, "Wave A".."Wave E",
# PLAN-<slug> references) or this repo's own slop-pack vocabulary at
# warning-tier or above -- reusing scripts/check-slop.py's canonical rule
# pack (src/wiki/skills/diataxis-author/style/voice-rules.json via
# rule_pack.py) rather than a second word list. Conventional-commit prefixes
# and a parenthesized roadmap id (e.g. "(V6-15)") are unaffected; the commit
# body is never scanned. Same install posture as coauthor-guard -- no
# automated installer yet, see hooks/commit-msg-gate/hook.md for manual
# install steps on both hosts.
# 0.6.0 = coauthor-guard installs machine-wide and strips agents only. New
# install-global.{sh,ps1} copy git-hook-dispatch.sh into
# ~/.config/crickets/git-hooks under every git hook name and point git's
# global core.hooksPath at it, so the strip runs in every repo on the machine
# while each repo's own .git/hooks keep running (the dispatcher hands every
# hook on). The strip now removes only Co-Authored-By trailers naming an AI
# agent (vendor email domain, [bot] identity, or agent product name); human
# co-authors stay (operator's call, 2026-10-01). New SessionStart
# check-global.{sh,ps1}, read-only, warns only when an install breaks.
# 0.6.1 = adversarial-review fixes to 0.6.0's machine-wide coauthor-guard,
# before it shipped in a release. The dispatcher no longer installs
# reference-transaction / post-index-change (a shell per ref or index update
# made a 40-commit rebase take 8s), finds the repo's hooks with shell builtins
# and starts bash only for a message with a co-author line. It strips on
# applypatch-msg too (git am, rebase --apply), skips a pre-0.6.0 strip-all
# copy left in .git/hooks, and no longer needs git 2.31's --path-format.
# install-global reads core.hooksPath through system/global/[include]
# config, --check compares file contents with the shipped copies, and
# uninstall never deletes a directory a config still names (pwsh now resolves
# symlinks when it compares paths). The strip matches `Key : value` and
# bracketless emails, and checks product names against the name part only, so
# a person at gemini.com stays. check-global ignores a relative core.hooksPath.
# 0.6.2 = a second adversarial review, of 0.6.1's fixes, before release.
# install-global refuses a core.hooksPath an [includeIf] file sets, and
# --check fails inside a repo that resolves core.hooksPath elsewhere. --check
# compares hooks with a reference dispatcher kept in the install, so an older
# plugin copy no longer reads a newer install as stale. Symlinks resolve
# through the nearest existing parent, so a deleted hooks dir under a
# symlinked ~/.config can be reinstalled. The dispatcher honors
# GIT_COMMON_DIR and skips only an exact legacy strip-all copy. The strip
# finds the name in a bracketless trailer and judges a nameless one by its
# email's local part. check-global treats a UNC path as absolute; pwsh -Check
# tests the executable bit.
version: 0.6.2
