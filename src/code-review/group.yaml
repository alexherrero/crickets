name: Code Review
description: Standalone adversarial code review of any diff or PR — the adversarial-reviewer (+ cross-model Gemini) agents, the security-auditor agent, and the evidence-tracker hook. Its reviewers and cross-review.sh run /build-it's review passes when development-lifecycle is installed.
# 0.2.0 = skill enrichment batch: /simplify command (Chesterton's Fence + Rule of 500),
# security-review skill (three-tier boundary: LLM API / persistence / system execution),
# testing-strategy skill (DAMP over DRY + Beyonce Rule + Prove-It pattern),
# security-auditor agent, test-engineer agent.
# 0.2.1 = declare capabilities: [adversarial-review] so the agentm V5-8 capability
# resolver can answer "is adversarial-review available?" (LC-5 cutover).
# 0.2.2 = (undocumented prior bump)
# 0.2.3 = evidence-tracker now recognizes a NAMED plan (.harness/PLAN-<slug>.md),
# not just the singleton .harness/PLAN.md — the default-FAIL contract was
# silently dead on the multi-plan path every worker/named-plan session
# actually uses (cricketsPluginsA#3, PLAN-r2-enforcement-and-sync task 1).
# 0.2.4 = cross-review.sh's validate() is now sourceable in isolation (a
# source-guard wraps the gemini-calling main() so a test can exercise the
# real output-contract check without needing the gemini CLI installed).
# 0.2.5 = evidence-tracker recognizes ABLATE_EVIDENCE_TRACKER=1 — the
# mechanical-uplift baseline off-state (agentm PLAN-r3-uplift-scoring task 1,
# R3.1a): enforcement disabled, the bad-flip fixture sails through
# undetected (rc 0 instead of 2). Additive to the default-FAIL contract.
# 0.2.6 = AG Wave A rename 1: enhances target developer-workflows -> development-lifecycle.
# 0.2.7 = PLAN-opinion-consumer-grammar task 3: agents/adversarial-reviewer.md
# declares opinions: [good] -- code-review IS good's implements: artifact
# (self-provider, per the locked agentm opinion-registry consumer grammar),
# so this stays hardwired, no interpolation, honesty-checked by a new
# check-opinion-self-provider-drift.py that flags the agentm opinions/good.md
# stub falling out of sync with this file's own prose, never the reverse
# (own frontmatter version 0.1.0 -> 0.1.1).
# 0.3.0 = cross-review.sh's two fallback paths (gemini missing / gemini's
# reply violates the output contract twice) each print a
# "CROSS-REVIEW-DEGRADED: ..." line on stdout before exiting, so a broken or
# absent gemini CLI can no longer silently turn a "cross-model" review into a
# same-model one -- previously only a stderr diagnostic + the exit code
# recorded the fallback, easy to lose in a transcript. adversarial-reviewer-
# cross.md's Step 4 now relays that line verbatim instead of paraphrasing it
# away (own frontmatter version 0.1.0 -> 0.2.0). New
# scripts/test_cross_review_degradation.py exercises all three paths against
# a mocked gemini binary on PATH -- well-formed passthrough, malformed-reply-
# then-one-retry-then-reject, and missing-binary -- no live LLM calls.
# 0.3.1 = cross-review.sh's transport retargets from the standalone `gemini`
# CLI to `agy` (the Antigravity CLI, still serving Gemini) -- Google
# discontinued Gemini CLI for individuals (V8 proving Lane G, 2026-07-13).
# Same architecture: output contract, single retry, exit-code semantics, and
# the CROSS-REVIEW-DEGRADED marker (now keyed on `command -v agy`) all carry
# over verbatim. One real adaptation: `agy -p` does not append piped stdin
# to the prompt the way `gemini -p` did (confirmed live), so the review
# material is concatenated into the -p argument instead, with agy's own
# stdin explicitly closed. Verified against a real cross-model review on a
# planted-bug diff (own frontmatter version 0.2.0 -> 0.3.0).
# 0.3.2 = testing-strategy's Prove-It Pattern gains an explicit sub-rule for
# bug-fix regression tests: a test that only ever passes was never proven to
# test anything -- revert the fix (or check out the pre-fix commit) and
# confirm the regression test actually fails, using the real failure's own
# reproduction shape, not a simplified stand-in. Prompted by a real, confirmed
# case (agentm PR #316, corrected in #317): a shipped regression test used a
# simplified repro that passed against both the real fix and a wrong one,
# because it was never capable of exercising the condition the wrong fix
# failed to handle. New checklist item; new Common Rationalizations row (own
# frontmatter version 0.1.0 -> 0.1.1).
# 0.3.4 = cross-review.sh prints its CROSS-REVIEW-DEGRADED marker on every
# fallback exit. agy meets --print-timeout by exiting 0 with nothing (or a
# cut-off answer) on stdout and a "print timeout" line on stderr; the script
# sent that stderr to /dev/null and wrote only "agy call failed (exit 0)", so
# the agentm plan 07 review (2026-09-13) fell back to a same-model review
# five times with no marker. The reason now gives agy's exit code, the
# seconds it ran and whether the print timeout fired, and a cut-off answer
# degrades instead of passing validate(). Material over MAX_MATERIAL_BYTES
# (50,000: the largest code-diff review measured inside the 180s timeout)
# degrades before agy is called; CROSS_REVIEW_MAX_BYTES overrides it. Empty
# stdin carries the marker too. adversarial-reviewer-cross.md's Step 4,
# /code-review and /doubt name the new reasons and say agy, not gemini (own
# frontmatter versions 0.3.0 -> 0.3.1, 0.1.0 -> 0.1.1).
# 0.4.0 = agentm-vault part 15 (crickets task 100-retire-harness-in-the-other-plugins):
# scripts/project_homes.py (new, byte-identical in code-review, design,
# github-projects, wiki and tokens; pinned by scripts/test_project_homes.py)
# asks agentm where a project's tasks/, designs/ and desk/ are and which plans
# it has (process_seam.py project-path, harness_memory.py list-plans), so no
# plugin composes a project path.
# The evidence tracker gates a task's plan.md again: a file is a plan when
# agentm lists it, asked only on a candidate flip, failing closed when an
# installed agentm gives no answer; a repo-local .harness/PLAN(-slug).md stays
# gated by its shape. The vault harness directory is no longer a plan home.
# 0.4.1 = cross-review.sh asks agy for "Gemini 4 Argon (High)". agy 1.4.0
# stopped serving "Gemini 3.1 Pro (High)" and rejects it with exit 1, so
# every review since 2026-10-16 took the same-model fallback.
# CROSS_REVIEW_MODEL names another model without editing the script.
# 0.4.2 = a model agy rejects degrades with "agy does not serve model '<MODEL>'"
# instead of "agy returned no output", and agy's error line reaches stderr
# (the five-line stderr tail held only its model list); agent 0.3.2 lists it.
# 0.4.3 = Antigravity: the four agents lose the tools: and model: lines agy
# 1.4 cannot read (it was skipping them), and the three commands ship as
# skills, which is how an agy plugin gets a /name.
# 0.4.4 = cross-review.sh runs agy with AGENTM_AGY_RECALL=off, so agentm's agy
# recall plugin does not put the operator's memory vault in front of the reviewer.
# 0.5.0 = cross-review.sh picks its model by tier, not one pin: --tier (or
# CROSS_REVIEW_TIER) takes default (Gemini 4 Neon Medium, 180s, 50 KB), high
# (Neon High, 300s, 80 KB: direction and large-task correctness) or wording
# (Gemini 4 Hydrogen High: wording and voice). CROSS_REVIEW_MODEL,
# CROSS_REVIEW_TIMEOUT_SECS and CROSS_REVIEW_MAX_BYTES still win; an unknown
# tier or argument exits 2 before agy is called. Gemini 4 Argon (High) is no
# longer the default. Plan 103 (build-it / create-it loop), step 1.
# 0.6.0 = scripts/review_material.py (plan 103, step 3): builds the text a
# reviewer is shown, as === ARTIFACT === / === CONTRACT === / === RULES ===,
# from a git range, the working tree, a PR or a file list. RULES comes from the
# anchor first (a spec's Rules with their sources, else a plan's locked calls
# and constraints, plus a likeness list), then the AGENTS.md / CLAUDE.md
# paragraphs that share the most terms with the change, under a 40-line cap and
# the tier's byte ceiling. It reads no reasoning and is told no suspected bug;
# a missing anchor gives an empty RULES with the reason. scripts/spec_doc.py is
# a byte-identical copy of development-lifecycle's (it parses the spec).
# 0.6.1 = fixes from plan 103's /review (#287): review_material.py --worktree
# adds untracked, non-ignored files as new-file diffs (git diff HEAD never
# lists them, so a new module reached its reviewers as an empty artifact), and
# an empty artifact from --worktree, --range or --pr exits 2 ("nothing to
# review"); cross-review.sh ignores CROSS_REVIEW_TIMEOUT_SECS=00 as it does 0.
# 1.0.0 = /doubt, /code-review and /simplify retire, and the test-engineer
# agent goes (plan 104 step 6): /build-it --check reviews an existing change,
# its simplicity pass replaces /simplify, and the missing-test lens is now a
# category in cross-review.sh's prompt and adversarial-reviewer's checklist.
# Major because commands go away.
# 2.0.0 = the testing-strategy and security-review skills retire (plan 105
# step 4; 0 uses). testing-strategy's Prove-It, regression-proof and DAMP
# points join the correctness rubric (cross-review.sh, adversarial-reviewer
# 0.3.0); security-auditor stays the security pass.
# 2.0.1 = review_material.py's changed_paths() reads names with spaces and
# names git quotes (#288 item 1), so the rule matching sees those files.
# 2.1.0 = review_material.py leaves files marked linguist-generated out of a
# diff's ARTIFACT (and names them on stderr), and pins git's output so the
# operator's diff.noprefix or core.quotePath cannot change what is read.
version: 2.1.0
category: Coding
requires: []
standalone: true
capabilities: [adversarial-review]
enhances:
  - group: development-lifecycle
    capability: review
    effect: "/build-it's review passes dispatch the adversarial reviewers (failing test / DEFECT: file:line / NO ISSUES FOUND)"
